    <!-- Consent Mode v2 (19/09/2026): a tag carrega SEMPRE, com consentimento
         negado por padrão; o aceite do banner só atualiza o estado (script.js).
         Antes o gtag só era injetado depois do "Aceitar", e quem recusava ou
         ignorava o banner não gerava ping nenhum — o Google não recebia sinal e
         não tinha o que modelar. GA4 G-M9WEG41PNK · Ads AW-18462540145. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        ad_storage:            'denied',
        ad_user_data:          'denied',
        ad_personalization:    'denied',
        analytics_storage:     'denied',
        functionality_storage: 'granted',
        security_storage:      'granted',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      // Quem já aceitou numa visita anterior: atualiza ANTES do primeiro ping,
      // senão o page_view sai marcado como negado. A chave é a mesma do
      // script.js (CONSENT_KEY).
      try {
        if (localStorage.getItem('p-lab-cookie-consent') === 'accepted') {
          gtag('consent', 'update', {
            ad_storage:         'granted',
            ad_user_data:       'granted',
            ad_personalization: 'granted',
            analytics_storage:  'granted'
          });
        }
      } catch (e) {}

      gtag('js', new Date());
      gtag('config', 'G-M9WEG41PNK');
      gtag('config', 'AW-18462540145');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M9WEG41PNK"></script>

        </p>

    <!-- A conversão é contada AQUI: esta página só é alcançada depois que o
         formsubmit aceitou o envio, então é a prova de lead real (o evento no
         submit corria o risco de ser cortado pelo POST na mesma aba).

         A conversão do Ads é a principal da conta; a importada do GA4 fica
         como secundária, para o mesmo lead não ser contado duas vezes. -->
    <script>
      try {
        var ud = JSON.parse(sessionStorage.getItem('plab_lead') || 'null');
        if (ud && ud.email) {
          gtag('set', 'user_data', { email: ud.email });
          sessionStorage.removeItem('plab_lead');
        }
      } catch (e) { /* sem sessionStorage: conta a conversão sem enriquecer */ }

      gtag('event', 'conversion', { send_to: 'AW-18462540145/E6STCJC8hP4cEPGC0ONE' });
      gtag('event', 'gerar_lead', { form: 'contato', origem: 'site' });
    </script>
