<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-LAB | Erro 404 - Página não encontrada</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="images/logo-icon.png">
    <script>(function(){try{var t=localStorage.getItem('p-lab-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="plab-tokens.css">
    <!-- Consent Mode v2 (19/09/2026): a tag carrega SEMPRE, com consentimento
         negado por padrão; o aceite do banner só atualiza o estado (script.js).
         Antes o gtag só era injetado depois do "Aceitar", e quem recusava ou
         ignorava o banner não gerava ping nenhum — o Google não recebia sinal e
         não tinha o que modelar. GA4 G-M9WEG41PNK · Ads AW-18462540145. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        ad_storage:            'denied',
        ad_user_data:          'denied',
        ad_personalization:    'denied',
        analytics_storage:     'denied',
        functionality_storage: 'granted',
        security_storage:      'granted',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      // Quem já aceitou numa visita anterior: atualiza ANTES do primeiro ping,
      // senão o page_view sai marcado como negado. A chave é a mesma do
      // script.js (CONSENT_KEY).
      try {
        if (localStorage.getItem('p-lab-cookie-consent') === 'accepted') {
          gtag('consent', 'update', {
            ad_storage:         'granted',
            ad_user_data:       'granted',
            ad_personalization: 'granted',
            analytics_storage:  'granted'
          });
        }
      } catch (e) {}

      gtag('js', new Date());
      gtag('config', 'G-M9WEG41PNK');
      gtag('config', 'AW-18462540145');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M9WEG41PNK"></script>
</head>
<body>
    <main class="container text-center" style="padding: 120px 0; min-height: 60vh;">
        <h1 style="font-size: 6rem; color: var(--accent); margin-bottom: 0;">404</h1>
        <h2>Ops! Ocorreu um erro de coordenadas.</h2>
        <p style="margin: 20px auto 32px; color: var(--text-muted);">A página que você procura foi movida ou não existe no servidor P-LAB.</p>
        <a href="index.html" class="btn-primary">Voltar para a Home</a>
    </main>
    <script src="script.js"></script>
</body>
</html>
